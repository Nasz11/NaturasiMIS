services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naturasimis-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: NaturasiMIS
      APP_ENV: local
      APP_KEY: base64:9aX3pC2F5e7T0bU6W8Q1M4kL7dE9rT2vY4uI6oP8sN0=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: naturasi_mis
      DB_USERNAME: naturasi_user
      DB_PASSWORD: secret_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules

  db:
    image: mysql:8.0
    container_name: naturasimis-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: naturasi_mis
      MYSQL_USER: naturasi_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
    driver: local
